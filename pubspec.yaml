name: lochness
description: Share your location with family and friends, for a duration or forever.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Backend
  supabase_flutter: ^2.5.6

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Location
  geolocator: ^12.0.0

  # Maps (OpenStreetMap - no API key required for MVP)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Notifications
  flutter_local_notifications: ^17.2.2

  # Permissions
  permission_handler: ^11.3.1

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0
  share_plus: ^9.0.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
